{% extends "base.html" %}
{% block title %}Passwort ändern &middot; openVerba{% endblock %}
{% block content %}
<h1>Passwort ändern</h1>

{% if forced %}
  <p class="msg warn">
    Dein Zugang wurde mit einem vorläufigen Passwort angelegt. Bitte setze jetzt ein
    eigenes, dann geht es weiter.
  </p>
{% endif %}

<form method="post" action="/password" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Aktuelles Passwort
    <input type="password" name="current_password" required autofocus autocomplete="current-password">
  </label>
  <label>Neues Passwort
    <input type="password" name="new_password" required autocomplete="new-password">
  </label>
  <label>Noch einmal
    <input type="password" name="repeat_password" required autocomplete="new-password">
  </label>
  <button type="submit">Ändern</button>
</form>
{% endblock %}
