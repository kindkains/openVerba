{% extends "base.html" %}
{% block title %}Anmelden &middot; openVerba{% endblock %}
{% block content %}
<h1>Anmelden</h1>

<form method="post" action="/login" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Benutzername
    <input type="text" name="username" value="{{ username|default('') }}" required autofocus autocomplete="username">
  </label>
  <label>Passwort
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">Anmelden</button>
</form>

<p class="muted"><a href="/forgot">Passwort vergessen?</a></p>
{% endblock %}
